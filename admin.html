<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — loot nexus</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="admin.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <h1 class="logo">loot nexus</h1>
            <ul class="nav-links">
                <li><a href="index.html">home</a></li>
                <li><a href="shop.html">shop</a></li>
                <li><a href="contact.html">contact</a></li>
            </ul>
            <div class="icons">
                <a href="cart.html"><i class='bx bx-cart-add'></i><span class="cart-count">0</span></a>
                <a href="contact.html"><i class='bx bx-user'></i></a>
            </div>
        </div>
    </nav>

    <section class="admin-section">

        <!-- Login screen -->
        <div id="admin-login" class="admin-login hidden">
            <h1>Admin Login</h1>
            <p>Enter the admin password to view orders.</p>
            <form id="admin-login-form">
                <div class="admin-password-wrap">
                    <input type="password" id="admin-password" placeholder="Password" autocomplete="current-password" required>
                    <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Show password" aria-pressed="false">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                <button type="submit">Log in</button>
            </form>
            <p id="admin-login-error" class="admin-error hidden"></p>
        </div>

        <!-- Dashboard -->
        <div id="admin-dashboard" class="admin-dashboard hidden">
            <div class="admin-header">
                <h1>Orders</h1>
                <button id="admin-logout" class="back-btn">Log out</button>
            </div>

            <div class="admin-stats">
                <div class="admin-stat">
                    <span class="admin-stat-value" id="stat-pending">0</span>
                    <span class="admin-stat-label">Pending</span>
                </div>
                <div class="admin-stat">
                    <span class="admin-stat-value" id="stat-processing">0</span>
                    <span class="admin-stat-label">Processing</span>
                </div>
                <div class="admin-stat">
                    <span class="admin-stat-value" id="stat-completed">0</span>
                    <span class="admin-stat-label">Completed</span>
                </div>
                <div class="admin-stat">
                    <span class="admin-stat-value" id="stat-revenue">$0.00</span>
                    <span class="admin-stat-label">Completed revenue</span>
                </div>
            </div>

            <div class="admin-tabs" id="admin-tabs">
                <button class="admin-tab active" data-status="all">All</button>
                <button class="admin-tab" data-status="pending">Pending</button>
                <button class="admin-tab" data-status="processing">Processing</button>
                <button class="admin-tab" data-status="completed">Completed</button>
                <button class="admin-tab" data-status="cancelled">Cancelled</button>
                <button id="admin-refresh" class="admin-tab admin-refresh-btn" type="button"><i class='bx bx-refresh'></i> Refresh</button>
            </div>

            <div id="admin-orders" class="admin-orders">
                <p class="admin-empty">Loading orders…</p>
            </div>
        </div>

    </section>

    <footer>
        <p>loot nexus — fast digital game deals</p>
        <p>© 2026 loot nexus</p>
    </footer>

    <script src="admin.js" defer></script>
</body>
</html>
